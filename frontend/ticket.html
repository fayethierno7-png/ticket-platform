<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon ticket | MAK_MAK_NÉ TICKETS</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a class="brand" href="index.html">MAK_MAK_NÉ TICKETS</a></nav><main class="wrap"><article class="panel ticket" id="ticket"><h1>Votre ticket numérique</h1><div id="content"></div></article><p style="text-align:center"><button onclick="print()">Imprimer / télécharger en PDF</button></p></main><script src="js/app.js"></script><script>const tickets=JSON.parse(sessionStorage.getItem('lastTickets')||'[]'),c=document.querySelector('#content');if(!tickets.length)c.innerHTML='<p class="notice error">Aucun ticket récent. Retournez à la page d’achat.</p>';else c.innerHTML=tickets.map(t=>`<section><dl><div><dt>Client</dt><dd>${t.customer}</dd></div><div><dt>Numéro</dt><dd>${t.code}</dd></div><div><dt>Prix</dt><dd>${fmt(t.price)}</dd></div><div><dt>Acheté le</dt><dd>${date(t.purchasedAt)}</dd></div><div><dt>Expire le</dt><dd>${date(t.expiresAt)}</dd></div><div><dt>Statut</dt><dd>VALIDE</dd></div></dl><img class="qr" alt="QR code de vérification" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(t.qrToken)}"></section>`).join('<hr>');</script></body></html>
