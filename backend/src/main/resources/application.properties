spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticket_platform?createDatabaseIfNotExist=true&serverTimezone=Africa%2FDakar}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jackson.time-zone=Africa/Dakar
server.port=${PORT:8080}
app.cors-origin=${CORS_ORIGIN:http://localhost:8080}
# Mode essai : autorise les achats en dehors de la fenêtre jeudi 00:00 → vendredi 10:00.
# Passez cette valeur à false avant la mise en production.
app.testing-mode=${TESTING_MODE:true}
